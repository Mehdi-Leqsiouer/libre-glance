repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(ios|android)/.*\.(png|pbxproj)$
      - id: trailing-whitespace
        exclude: ^(ios|android)/
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format
        language: system
        types: [dart]
      - id: flutter-analyze
        name: flutter analyze
        entry: flutter analyze
        language: system
        types: [dart]
        pass_filenames: false
      - id: flutter-test
        name: flutter test
        entry: flutter test
        language: system
        types: [dart]
        pass_filenames: false
      - id: server-ruff
        name: ruff check (server)
        entry: uv run --project server ruff check server
        language: system
        files: ^server/
        pass_filenames: false
      - id: server-format
        name: ruff format (server)
        entry: uv run --project server ruff format --check server
        language: system
        files: ^server/
        pass_filenames: false
      - id: server-tests
        name: pytest (server)
        entry: uv run --project server pytest -q server
        language: system
        files: ^server/
        pass_filenames: false
      - id: terraform-fmt
        name: terraform fmt (infra)
        entry: terraform fmt -check -recursive infra
        language: system
        files: ^infra/
        pass_filenames: false
